<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoluntaMe - Registro</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
        .error { color: red; padding: 0.5rem; background: #ffebee; border-radius: 4px; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.7rem; background: #4caf50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        a { color: #2196f3; text-decoration: none; }
    </style>
</head>
<body>
    <h1>VoluntaMe</h1>
    <h2>Registro</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for categoria, mensaje in messages %}
                <p class="{{ categoria }}">{{ mensaje }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/registro" method="POST">
        <div>
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ nombre }}" required>
        </div>
        <div>
            <label>Apellido:</label>
            <input type="text" name="apellido" value="{{ apellido }}" required>
        </div>
        <div>
            <label>E-mail:</label>
            <input type="email" name="email" value="{{ email }}" required>
        </div>
        <div>
            <label>Contraseña:</label>
            <input type="password" name="contrasena" required>
        </div>
        <div>
            <label>Confirmar Contraseña:</label>
            <input type="password" name="confirmar_contrasena" required>
        </div>
        <button type="submit">Registrar</button>
    </form>

    <p>¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p>
</body>
</html>
