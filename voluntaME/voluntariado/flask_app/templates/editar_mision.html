<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoluntaMe - Editar Misión</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .cabecera { display: flex; justify-content: space-between; align-items: center; }
        .btn { padding: 0.5rem 1rem; background: #666; color: white; text-decoration: none; border-radius: 4px; }
        .btn-rojo { background: #f44336; }
        .error { color: red; padding: 0.5rem; background: #ffebee; border-radius: 4px; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input, textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 0.7rem; background: #ff9800; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>
    <div class="cabecera">
        <h1>Editar Misión</h1>
        <div>
            <a href="/dashboard" class="btn">Inicio</a>
            <a href="/cerrar_sesion" class="btn btn-rojo">Cerrar Sesión</a>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
                <p class="{{ cat }}">{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/editar/{{ mision.id }}" method="POST">
        <div>
            <label>Nombre:</label>
            <input type="text" name="nombre" value="{{ mision.nombre }}" required>
        </div>
        <div>
            <label>Fecha:</label>
            <input type="date" name="fecha" value="{{ mision.fecha }}" required>
        </div>
        <div>
            <label>Voluntarios Necesarios (entre 2 y 20):</label>
            <input type="number" name="voluntarios_necesarios" min="2" max="20" value="{{ mision.voluntarios_necesarios }}" required>
        </div>
        <div>
            <label>Descripción:</label>
            <textarea name="descripcion" rows="4" required>{{ mision.descripcion }}</textarea>
        </div>
        <button type="submit">Actualizar</button>
    </form>
</body>
</html>
